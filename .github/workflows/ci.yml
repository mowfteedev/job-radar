name: CI Quality Gate & Automated Tests

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 🐍 Python Ingestion & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Audit Zero Secret Leaks
        run: |
          python -c "from src.security.secret_scanner import SecretScanner; s = SecretScanner(); f = s.scan(); assert len(f) == 0, f'Found leaks: {f}'"

  frontend-test:
    name: 🎨 Astro Web Build & UI Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: 📦 Install Web Dependencies
        run: |
          npm --prefix web ci

      - name: 🏗️ Build Static Site (Astro SSG)
        run: |
          npm --prefix web run build


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-tech-job-radar"
version = "0.1.0"
description = "Automated pipeline tracking Network, DevOps, SysAdmin and IT support roles in Vietnam"
readme = "README.md"
authors = [
    { name = "mowftee", email = "mowfteedev@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
